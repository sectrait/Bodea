<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Bodea Inc.</title>
<meta name="description" content="Log in to your Bodea account.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="main">
<div class="auth"><div class="collage" aria-hidden="true"><img class="a" src="img/300144034.jpg" alt="" loading="lazy"><img class="b" src="img/345608114.jpg" alt="" loading="lazy"><img class="c" src="img/220533864.jpg" alt="" loading="lazy"><img class="d" src="img/201734319.jpg" alt="" loading="lazy"><img class="e" src="img/407170488.jpg" alt="" loading="lazy"><img class="f" src="img/268298849.jpg" alt="" loading="lazy"><img class="g" src="img/515182802.jpg" alt="" loading="lazy"><img class="h" src="img/228326085.jpg" alt="" loading="lazy"><img class="i" src="img/338903738.jpg" alt="" loading="lazy"></div><div class="auth-main"><div class="auth-box narrow"><a class="logo" href="index.html">BODEA</a><h1>Log in to your account</h1><form data-validate data-ok="Demo only: sign-in is not connected to a live service." novalidate>
<div class="field"><label class="f" for="l-name">Name</label><input id="l-name" type="text" required maxlength="120" placeholder="Type your name.." autocomplete="username"><span class="err-t">Please enter your name.</span></div>
<div class="field"><label class="f" for="l-pw">Password</label><input id="l-pw" type="password" required maxlength="128" placeholder="Password" autocomplete="current-password"><span class="err-t">Password must be at least 8 characters.</span></div>
<button class="btn" type="submit" style="padding:15px 38px">Log in</button><div class="form-msg" role="status" aria-live="polite"></div></form>
<p class="alt">Don't have an account? <a href="register.html">Register</a></p></div></div></div><button class="chat-fab" aria-label="Chat with us" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/></svg></button><div class="chat-pop" hidden role="dialog" aria-label="Chat"><b>Need a hand?</b>Live chat is available in the Bodea mobile app. Or email us and a specialist will get back to you.</div>
</main>
<script src="script.js" defer></script>
</body>
</html>
